[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-quota-max-router"
version = "0.2.0"
description = "OpenAI-compatible router that maximizes use of free LLM tiers, preserves paid-plan quotas, and auto-discovers new free models."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Giolivo Santarelli", email = "giolivosantarelli@gmail.com"},
]
keywords = ["llm", "router", "openai-compatible", "free-tier", "litellm", "hermes", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "litellm[proxy]>=1.55.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "sqlmodel>=0.0.22",
    "redis>=5.2.0",
    "qdrant-client>=1.12.0",
    "jinja2>=3.1.4",
    "gradio>=5.0.0",
    "langsmith>=0.1.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "fakeredis>=2.26.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "hypothesis>=6.100.0",
]
self-host = [
    "vllm>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/Gigisanta/hermes-quota-max-router"
Repository = "https://github.com/Gigisanta/hermes-quota-max-router"
Issues = "https://github.com/Gigisanta/hermes-quota-max-router/issues"
Changelog = "https://github.com/Gigisanta/hermes-quota-max-router/blob/main/CHANGELOG.md"

[project.scripts]
# `pip install -e .` registers `quotamax` as a console entry point.
quotamax = "quotamax_router.__main__:main"

[tool.setuptools.packages.find]
include = ["core*", "server*", "dashboard*", "scripts*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
quotamax_router = ["config/*.yaml", "prompts/*.md", "registry/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "ASYNC", "RUF"]
ignore = [
    "E501",   # line length (handled by formatter)
    "B008",   # function call in default argument (FastAPI Depends)
    "RUF012", # mutable class attributes (Pydantic models)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "N", "RUF"]
# These entrypoints mutate sys.path / load .env before importing project code.
"server/app.py" = ["E402"]
"dashboard/app.py" = ["E402"]
"scripts/*" = ["E402"]
# Plugin directory name is dictated by the Hermes Agent plugin loader.
"scripts/hermes_plugin/quotamax-router/__init__.py" = ["N999"]

[tool.mypy]
# Let mypy target the interpreter that runs it.  CI checks both supported
# Python versions, and a fixed 3.11 target cannot parse stubs that use
# Python 3.12 syntax (for example, NumPy 2.5+ on the 3.12 job).
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
no_strict_optional = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
