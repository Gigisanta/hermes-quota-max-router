[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-quota-max-router"
version = "1.0.0"
description = "Fail-closed, zero-cost editorial LLM router for MaatWork"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "redis>=5.2,<7",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = ["fakeredis[lua]>=2.26,<3", "mypy>=1.11,<2", "pytest>=8.3,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.6,<1"]

[project.scripts]
quotamax = "free_router.cli:main"

[tool.setuptools.packages.find]
include = ["free_router*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests_v1"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
