name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check free_router tests_v1 main.py server/app.py server/__main__.py
      - run: ruff format --check free_router tests_v1 main.py server/app.py server/__main__.py
      - run: mypy free_router
      - run: pytest tests_v1 -q
